[pytest]
pythonpath = .
testpaths = tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
markers =
    smoke: Critical API tests executed on every build
    regression: Full functional regression suite
    auth: Authentication-related tests
    negative: Tests that verify errors and invalid inputs
    booking: Booking resource tests
